[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ"]
ignore = ["E501", "DJ012"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "despacho.settings_pruebas"
testpaths = ["tests"]
addopts = "-q"
