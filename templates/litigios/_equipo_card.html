<div class="card"><h3><span><span class="av">{{ t.u.nombre|iniciales }}</span>{{ t.u.nombre }} <span class="mini">· {{ t.u.get_rol_display }}</span></span><span class="mini">{{ t.items|length }} tarea{{ t.items|length|pluralize }}</span></h3>{% for i in t.items %}<div class="row click" data-href="{{ i.go }}"><div><b>{{ i.txt }}</b><div class="m">{% if i.plazo %}{{ i.plazo|fmt }}{% else %}sin plazo{% endif %}</div></div><div class="r"><span class="chip {{ i.cls }}">{{ i.chip }}</span></div></div>{% empty %}<div class="empty">Sin pendientes.</div>{% endfor %}</div>
