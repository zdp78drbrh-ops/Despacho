<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Despacho · Gestión jurídica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --page:#f3f3ef;--card:#ffffff;--card2:#f7f7f4;--side:#1f2a37;--side2:#2f4a6b;--side-t:#c9d1db;--side-m:#8b98a8;
  --t1:#24262a;--t2:#63625c;--t3:#9a998f;--line:#e2e1da;--line2:#eeede8;
  --acc:#185FA5;--acc-bg:#E6F1FB;--acc-t:#0C447C;
  --red-bg:#FCEBEB;--red-t:#791F1F;--red:#E24B4A;
  --amb-bg:#FAEEDA;--amb-t:#633806;--amb:#EF9F27;
  --grn-bg:#EAF3DE;--grn-t:#27500A;--grn:#639922;
  --gry-bg:#EDECE6;--gry-t:#444441;--gry:#B4B2A9;
  --radius:9px;--font:'IBM Plex Sans','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#191b1e;--card:#23262b;--card2:#2a2e34;--side:#111519;--side2:#2b3e57;--side-t:#c9d1db;--side-m:#7d8a9a;
  --t1:#ecebe6;--t2:#a8a79f;--t3:#77766f;--line:#33373d;--line2:#2c3035;
  --acc:#7fb3ea;--acc-bg:#16304a;--acc-t:#b5d4f4;
  --red-bg:#4a1c1c;--red-t:#f7c1c1;--amb-bg:#4a3510;--amb-t:#fac775;--grn-bg:#22391a;--grn-t:#c0dd97;--gry-bg:#33363a;--gry-t:#d3d1c7;
}}
:root[data-theme="dark"]{
  --page:#191b1e;--card:#23262b;--card2:#2a2e34;--side:#111519;--side2:#2b3e57;--side-t:#c9d1db;--side-m:#7d8a9a;
  --t1:#ecebe6;--t2:#a8a79f;--t3:#77766f;--line:#33373d;--line2:#2c3035;
  --acc:#7fb3ea;--acc-bg:#16304a;--acc-t:#b5d4f4;
  --red-bg:#4a1c1c;--red-t:#f7c1c1;--amb-bg:#4a3510;--amb-t:#fac775;--grn-bg:#22391a;--grn-t:#c0dd97;--gry-bg:#33363a;--gry-t:#d3d1c7;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--t1);font-family:var(--font);font-size:14px;line-height:1.45}
a{color:var(--acc);text-decoration:none;cursor:pointer}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100%}
.side{width:224px;flex-shrink:0;background:var(--side);color:var(--side-t);padding:22px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{color:#fff;font-size:17px;font-weight:600;padding:0 10px;margin-bottom:22px}
.brand small{display:block;color:var(--side-m);font-size:11px;font-weight:400;margin-top:2px}
.nav{display:block;padding:9px 12px;border-radius:7px;margin-bottom:3px;color:var(--side-t);font-size:13.5px}
.nav:hover{background:rgba(255,255,255,.06)}
.nav.on{background:var(--side2);color:#fff;font-weight:600}
.sub{display:block;padding:6px 12px 6px 26px;font-size:12.5px;color:var(--side-m)}
.sub.on{color:#fff}
.navsec{margin:16px 0 6px;font-size:11px;color:#6f7d8e;padding-left:12px}
.side .yo{margin-top:auto;padding:10px 4px 0;border-top:1px solid rgba(255,255,255,.08);font-size:12px;color:var(--side-m)}
.side .yo select{width:100%;margin-top:6px;background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:6px 8px}
.side .sync{font-size:11px;color:var(--side-m);margin-top:8px}
.main{flex:1;min-width:0;padding:22px 28px 60px}
.topbar{display:none}
.crumb{font-size:12px;color:var(--t3);margin-bottom:4px}
.crumb a{color:var(--t2)}
.h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.h h1{font-size:20px;margin:0;font-weight:600}
.h h1 span{color:var(--t3);font-weight:400;font-size:13px;margin-left:8px}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.metric{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;cursor:pointer}
.metric .l{font-size:12px;color:var(--t2)}
.metric .v{font-size:26px;font-weight:600;margin-top:2px}
.cols{display:grid;gap:16px}
.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:1fr 1fr 1fr}.c21{grid-template-columns:1.6fr 1fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:4px 16px;margin-bottom:16px}
.card h3{font-size:13.5px;margin:10px 0 4px;display:flex;justify-content:space-between;align-items:center;font-weight:600;gap:8px}
.card h3 a,.card h3 .lnk{font-size:12px;font-weight:400}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px solid var(--line2);font-size:13px}
.row:first-of-type,.row.first{border-top:none}
.row.click{cursor:pointer}
.row.click:hover b{color:var(--acc)}
.row b{display:block;font-weight:600;font-size:13px}
.row .m{color:var(--t2);font-size:12px;margin-top:1px}
.row .r{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex-shrink:0}
.empty{color:var(--t3);font-size:12.5px;padding:10px 0}
.chip{font-size:11px;padding:2px 9px;border-radius:99px;white-space:nowrap;font-weight:600;display:inline-block;line-height:1.6}
.red{background:var(--red-bg);color:var(--red-t)}.amb{background:var(--amb-bg);color:var(--amb-t)}.blu{background:var(--acc-bg);color:var(--acc-t)}.grn{background:var(--grn-bg);color:var(--grn-t)}.gry{background:var(--gry-bg);color:var(--gry-t)}
.filters{display:flex;gap:6px;margin:8px 0 4px;flex-wrap:wrap}
.filters span{font-size:11.5px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--t2);cursor:pointer}
.filters span.on{background:var(--acc-bg);border-color:transparent;color:var(--acc-t);font-weight:600}
.btn{display:inline-flex;align-items:center;padding:7px 13px;border-radius:7px;border:1px solid var(--line);background:var(--card);font-size:12.5px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--card2)}
.btn.p{background:var(--acc);color:#fff;border-color:var(--acc);font-weight:600}
.btn.p:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 9px;font-size:11.5px}
.btn.danger{color:var(--red-t)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.hdr{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:16px}
.hdr .t{font-size:19px;font-weight:600;line-height:1.3}
.hdr .s{color:var(--t2);font-size:12.5px;margin-top:3px}
.hdr .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.hdr .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 18px;margin-top:14px}
.grid .l{font-size:11.5px;color:var(--t2)}
.grid .v{font-size:13px;font-weight:600;margin-top:1px}
table{width:100%;border-collapse:collapse;font-size:12.5px;margin:4px 0 8px}
th{text-align:left;font-size:11.5px;color:var(--t2);font-weight:400;padding:6px 8px 6px 0;border-bottom:1px solid var(--line)}
td{padding:8px 8px 8px 0;border-bottom:1px solid var(--line2);vertical-align:top}
tr.done td{color:var(--t3)}
.tw{overflow-x:auto;max-width:100%}
.steps{display:flex;gap:6px;margin-top:16px}
.step{flex:1;font-size:11.5px;color:var(--t3);padding-top:7px;border-top:4px solid var(--line);text-align:center}
.step.done{border-color:var(--grn);color:var(--grn-t)}
.step.on{border-color:var(--acc);color:var(--acc-t);font-weight:600}
.av{width:30px;height:30px;border-radius:50%;background:var(--acc-bg);color:var(--acc-t);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;margin-right:10px;flex-shrink:0}
.chk{display:inline-block;width:15px;height:15px;border:1.5px solid var(--t3);border-radius:3px;vertical-align:-3px;margin-right:6px;cursor:pointer}
.chk.on{background:var(--grn);border-color:var(--grn);color:#fff;font-size:10px;text-align:center;line-height:13px}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--t2);margin:0 0 12px;flex-wrap:wrap}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.note{font-size:12px;color:var(--t2);padding:6px 0 10px}
.lnk{color:var(--acc);cursor:pointer;font-size:12px}
.mini{font-size:11.5px;color:var(--t2)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 12px 20px;z-index:50;overflow-y:auto}
.md{background:var(--card);border-radius:12px;width:100%;max-width:560px;padding:20px 22px;border:1px solid var(--line)}
.md h2{font-size:16px;margin:0 0 14px;font-weight:600}
.f{margin-bottom:12px}
.f label{display:block;font-size:12px;color:var(--t2);margin-bottom:4px}
.f input,.f select,.f textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--card2);color:var(--t1)}
.f textarea{min-height:70px;resize:vertical}
.f .hint{font-size:11px;color:var(--t3);margin-top:3px}
.f.inline{display:flex;gap:8px;align-items:center}
.f.inline input[type=checkbox]{width:auto}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.macts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.err{color:var(--red-t);font-size:12px;margin-top:6px}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--t1);color:var(--page);padding:9px 16px;border-radius:8px;font-size:13px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.welcome{background:var(--acc-bg);color:var(--acc-t);border-radius:var(--radius);padding:14px 16px;margin-bottom:16px;font-size:13px}
.welcome b{display:block;margin-bottom:4px;font-size:14px}
.welcome .btn{margin-top:8px;margin-right:6px}
pre.json{background:var(--card2);border:1px solid var(--line);border-radius:7px;padding:10px;font-size:11px;max-height:220px;overflow:auto;white-space:pre-wrap;word-break:break-all}
.cal-day{margin-bottom:14px}
.cal-day h4{font-size:12.5px;margin:0 0 4px;color:var(--t2);font-weight:600}
.cal-day.over h4{color:var(--red-t)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (max-width:960px){
  .side{display:none;position:fixed;inset:0;width:100%;height:100vh;z-index:40;padding-top:calc(60px + env(safe-area-inset-top,0px))}
  .side.open{display:flex}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:45;background:var(--side);color:#fff;padding:12px 16px;align-items:center;justify-content:space-between;padding-top:calc(12px + env(safe-area-inset-top,0px))}
  .topbar b{font-size:15px}
  .topbar button{background:none;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:6px;padding:4px 10px}
  .main{padding:16px 14px 60px}
  .metrics{grid-template-columns:1fr 1fr}
  .c2,.c3,.c21{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr 1fr}
  .steps{flex-wrap:wrap}.step{min-width:30%}
  .f2{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
</style>

<body>
<div class="topbar"><b id="tbTitle">Despacho</b><button id="tbMenu" aria-label="Menú">Menú</button></div>
<div class="app">
  <nav class="side" id="side"></nav>
  <main class="main" id="main"></main>
</div>
<div id="modal"></div>
<div class="toast" id="toast"></div>
<script>
/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const pad = n => String(n).padStart(2,'0');
function todayISO(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function parseISO(s){ if(!s) return null; const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function fmt(s, withYear){ const d=parseISO(s); if(!d) return '—'; const y = withYear || d.getFullYear()!==new Date().getFullYear(); return `${d.getDate()} ${MESES[d.getMonth()]}${y?' '+d.getFullYear():''}`; }
function fmtLong(s){ const d=parseISO(s); if(!d) return ''; return `${DIAS[d.getDay()]} ${d.getDate()} de ${['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'][d.getMonth()]} de ${d.getFullYear()}`; }
function daysUntil(s){ const d=parseISO(s); if(!d) return null; const t=parseISO(todayISO()); return Math.round((d-t)/86400000); }
function daysSince(s){ const n=daysUntil(s); return n==null?null:-n; }
function addDays(s,n){ const d=parseISO(s); d.setDate(d.getDate()+n); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function addBusinessDays(s,n){ let d=parseISO(s); let c=0; while(c<n){ d.setDate(d.getDate()+1); if(d.getDay()!==0&&d.getDay()!==6) c++; } return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function plazoChip(s, label){ const n=daysUntil(s); if(n==null) return ''; let cls='blu', txt=label||fmt(s); if(n<0){cls='red';txt=`Venció ${fmt(s)}`;} else if(n===0){cls='red';txt='Vence hoy';} else if(n===1){cls='red';txt='Vence mañana';} else if(n<=3){cls='red';txt=`Vence en ${n} días`;} else if(n<=7){cls='amb';txt=`Vence en ${n} días`;} else {txt=`Vence ${fmt(s)}`;} return `<span class="chip ${cls}">${txt}</span>`; }
function money(n){ if(n==null||n==='') return '—'; return '$'+Number(n).toLocaleString('es-MX',{minimumFractionDigits:2}); }
function initials(n){ return String(n||'').replace(/^(Lic\.|Ing\.|Arq\.|Dr\.|Dra\.|C\.P\.)\s*/i,'').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join(''); }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200); }
function go(hash){ location.hash = hash; }
function byDateDesc(a,b){ return (b.fecha||'').localeCompare(a.fecha||''); }

/* ---------- catálogos ---------- */
const MATERIAS = ['Civil','Mercantil','Familiar','Penal','Amparo','Laboral','Administrativo'];
const ETAPAS = ['Presentación de demanda','Emplazamiento','Contestación','Audiencia preliminar','Desahogo de pruebas','Alegatos','Citado a sentencia','Sentencia','Apelación','Amparo','Ejecución','Convenio'];
const TIPOS_ACCION = ['Promoción','Escrito','Acto procesal','Diligencia','Gestión','Audiencia'];
const EST_ACC = {pendiente:['Pendiente','gry'], elaboracion:['En elaboración','blu'], revision:['En revisión','amb'], aprobada:['Aprobada','grn'], terminada:['Terminada','grn']};
const FLUJO_ACC = ['pendiente','elaboracion','revision','aprobada','terminada'];
const EST_CON = {elaboracion:['En elaboración','blu'], revision:['En revisión','amb'], aprobacion:['Por aprobar','amb'], aprobado:['Aprobado','grn'], firmado:['Firmado','grn']};
const FLUJO_CON = ['elaboracion','revision','aprobacion','aprobado','firmado'];
const CARPETAS = ['Acta constitutiva y estatutos','Actas de asamblea y libros corporativos','Poderes notariales','Constancias fiscales y RPC','Permisos y licencias','Contratos firmados','Otros'];
const RIESGOS = {alto:['Riesgo alto','red'], medio:['Riesgo medio','amb'], bajo:['Riesgo bajo','gry']};
const ETAPAS_TRAM = [['documentacion','Documentación'],['ingreso','Ingreso'],['prevencion','Prevención'],['resolucion','Resolución'],['entrega','Entrega al cliente'],['concluido','Concluido']];
const TIPOS_TRAM = {
  'Licencia de construcción':['Escritura de propiedad y libertad de gravamen','Dictamen de uso de suelo','Alineamiento y número oficial','Identificación y poder del representante','Proyecto arquitectónico y memoria de cálculo','Visto bueno de Protección Civil','Comprobante de pago de derechos'],
  'Dictamen de uso de suelo':['Escritura de propiedad','Identificación del solicitante','Croquis de localización','Comprobante de pago de derechos'],
  'Licencia de funcionamiento':['Acta constitutiva','Poder del representante','Constancia de situación fiscal','Uso de suelo','Visto bueno de Protección Civil','Comprobante de pago de derechos'],
  'Visto bueno de Protección Civil':['Programa interno de protección civil','Dictamen estructural','Plano del inmueble','Comprobante de pago'],
  'Registro de marca (IMPI)':['Solicitud de registro','Diseño de la marca','Comprobante de pago de tarifa','Poder del representante'],
  'Aviso de beneficiario controlador':['Acta constitutiva','Libro de accionistas actualizado','Identificaciones de beneficiarios'],
  'Otro':[]
};

/* ---------- estado y persistencia ---------- */
const KINDS = ['expedientes','clientes','tramites','acuerdos','usuarios'];
const S = {expedientes:[], clientes:[], tramites:[], acuerdos:[], usuarios:[]};
let db = null, dbReady = false, dbSubs = [];
const LS = 'despacho_proto_v1';
function lsLoad(){ try{ const raw=localStorage.getItem(LS); if(!raw) return false; const o=JSON.parse(raw); KINDS.forEach(k=>{ S[k]=Array.isArray(o[k])?o[k]:[]; }); return true; }catch(e){ return false; } }
function lsSave(){ try{ localStorage.setItem(LS, JSON.stringify(S)); }catch(e){} }
const writeQ = {};
function dbWrite(kind, obj){ if(!db) return; const key=kind+'/'+obj.id; const prev=writeQ[key]||Promise.resolve(); writeQ[key]=prev.then(()=>db.collection(kind).doc(obj.id).set(JSON.parse(JSON.stringify(obj)))).catch(e=>{ console.warn('db set',e); if(e&&e.code==='invalid_argument') toast('No tienes permiso para guardar cambios compartidos'); }); }
function dbDelete(kind, id){ if(!db) return; db.collection(kind).doc(id).delete().catch(e=>console.warn('db del',e)); }
function persist(kind, obj){ const i=S[kind].findIndex(x=>x.id===obj.id); if(i<0) S[kind].push(obj); else S[kind][i]=obj; lsSave(); dbWrite(kind,obj); }
function removeItem(kind, id){ S[kind]=S[kind].filter(x=>x.id!==id); lsSave(); dbDelete(kind,id); }
function yo(){ try{ return localStorage.getItem('despacho_yo')||''; }catch(e){ return ''; } }
function setYo(n){ try{ localStorage.setItem('despacho_yo',n); }catch(e){} }
function quien(){ return yo() || (S.usuarios[0]&&S.usuarios[0].nombre) || 'Sin asignar'; }

async function connectDb(){
  try{
    if(!window.claude||!window.claude.use) return;
    const d = await window.claude.use('db');
    if(!d) return;
    db = d;
    KINDS.forEach(k=>{
      const un = db.collection(k).onSnapshot(snap=>{
        const docs = snap.docs.filter(x=>x.exists).map(x=>x.data());
        if(!dbReady && docs.length===0 && S[k].length>0 && !snap.metadata.fromCache){
          // la base compartida está vacía y hay datos locales: subirlos una sola vez
          S[k].forEach(o=>dbWrite(k,o));
        } else if(!snap.metadata.fromCache || docs.length){
          S[k] = docs;
          lsSave();
          render();
        }
        if(!snap.metadata.fromCache) dbReady = true;
        renderSide();
      }, err=>{ console.warn('db sub',err); });
      dbSubs.push(un);
    });
  }catch(e){ console.warn('db',e); }
}

/* ---------- datos de ejemplo ---------- */
function seed(){
  const T = todayISO();
  const usuarios = [
    {id:'u1', nombre:'Abraham Jassen', rol:'Socio director (aprueba)'},
    {id:'u2', nombre:'Lic. Yairsinio García', rol:'Abogado senior (revisa)'},
    {id:'u3', nombre:'Lic. Mariana Ruiz', rol:'Abogada (elabora)'},
    {id:'u4', nombre:'Diego Mora', rol:'Auxiliar jurídico'},
  ];

/* ---------- modal y formularios ---------- */
function closeModal(){ $('#modal').innerHTML=''; }
function openModal(html){ $('#modal').innerHTML=`<div class="ov" id="ov"><div class="md" role="dialog" aria-modal="true">${html}</div></div>`; $('#ov').addEventListener('click',e=>{ if(e.target.id==='ov') closeModal(); }); const first=$('#modal').querySelector('input,select,textarea'); if(first) first.focus(); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeModal(); });
// fields: {k,label,type,options,value,required,hint,half}
function formModal(title, fields, onSubmit, opts={}){
  const inp = f => {
    const v = f.value ?? '';
    if(f.type==='select') return `<select name="${f.k}" ${f.required?'required':''}>${(f.options||[]).map(o=>{ const [val,lab]=Array.isArray(o)?o:[o,o]; return `<option value="${esc(val)}" ${val===v?'selected':''}>${esc(lab)}</option>`; }).join('')}</select>`;
    if(f.type==='textarea') return `<textarea name="${f.k}">${esc(v)}</textarea>`;
    if(f.type==='checkbox') return `<input type="checkbox" name="${f.k}" ${v?'checked':''}>`;
    return `<input type="${f.type||'text'}" name="${f.k}" value="${esc(v)}" ${f.required?'required':''} ${f.placeholder?`placeholder="${esc(f.placeholder)}"`:''}>`;
  };
  const fh = f => f.type==='checkbox' ? `<div class="f inline">${inp(f)}<label style="margin:0">${esc(f.label)}</label></div>` : `<div class="f"><label>${esc(f.label)}${f.required?' *':''}</label>${inp(f)}${f.hint?`<div class="hint">${f.hint}</div>`:''}</div>`;
  let html = `<h2>${esc(title)}</h2><form id="mf">`;
  let i=0; while(i<fields.length){ const f=fields[i]; if(f.half && fields[i+1] && fields[i+1].half){ html+=`<div class="f2">${fh(f)}${fh(fields[i+1])}</div>`; i+=2; } else { html+=fh(f); i++; } }
  html += `<div class="err" id="ferr"></div><div class="macts">${opts.extra||''}<button type="button" class="btn" id="fcancel">Cancelar</button><button type="submit" class="btn p">${esc(opts.submit||'Guardar')}</button></div></form>`;
  openModal(html);
  $('#fcancel').onclick = closeModal;
  if(opts.after) opts.after();
  $('#mf').onsubmit = e => {
    e.preventDefault();
    const fd = new FormData(e.target); const vals={};
    fields.forEach(f=>{ vals[f.k] = f.type==='checkbox' ? fd.get(f.k)==='on' : (fd.get(f.k)??'').toString().trim(); });
    const miss = fields.filter(f=>f.required && !vals[f.k]);
    if(miss.length){ $('#ferr').textContent='Falta: '+miss.map(f=>f.label).join(', '); return; }
    const err = onSubmit(vals); if(err){ $('#ferr').textContent=err; return; }
    closeModal();
  };
}
function confirmModal(msg, onOk, label='Eliminar'){ openModal(`<h2>Confirmar</h2><p style="font-size:13.5px">${esc(msg)}</p><div class="macts"><button class="btn" id="cno">Cancelar</button><button class="btn danger" id="cyes">${esc(label)}</button></div>`); $('#cno').onclick=closeModal; $('#cyes').onclick=()=>{ closeModal(); onOk(); }; }
function textModal(title, text, hint){ openModal(`<h2>${esc(title)}</h2>${hint?`<div class="note">${hint}</div>`:''}<div class="f"><textarea id="tm" style="min-height:260px;font-size:12.5px">${esc(text)}</textarea></div><div class="macts"><button class="btn" id="tclose">Cerrar</button><button class="btn p" id="tcopy">Copiar texto</button></div>`); $('#tclose').onclick=closeModal; $('#tcopy').onclick=async()=>{ try{ await navigator.clipboard.writeText($('#tm').value); toast('Copiado'); }catch(e){ $('#tm').select(); document.execCommand('copy'); toast('Copiado'); } }; }
function userOpts(blank){ const o=S.usuarios.map(u=>[u.nombre,u.nombre]); return blank?[['','— Sin asignar —'],...o]:o; }

/* ---------- derivados de expedientes ---------- */
const exp = id => S.expedientes.find(e=>e.id===id);
const cli = id => S.clientes.find(c=>c.id===id);
const tra = id => S.tramites.find(t=>t.id===id);
function pendientes(e){ return (e.acciones||[]).filter(a=>a.estado!=='terminada'); }
function ultima(e){ const b=[...(e.bitacora||[])].sort(byDateDesc); return b[0]||null; }
function proximoPlazo(e){ const p=pendientes(e).filter(a=>a.plazo).sort((a,b)=>a.plazo.localeCompare(b.plazo)); return p[0]||null; }
function diasSin(e){ const u=ultima(e); return u?daysSince(u.fecha):null; }
function urgencia(e){ // devuelve {cls, txt} o null
  const p=proximoPlazo(e); const n=p?daysUntil(p.plazo):null; const ds=diasSin(e);
  if(n!=null && n<=3) return {cls:'red', txt:n<0?'Plazo vencido':n===0?'Vence hoy':n===1?'Vence mañana':`Vence en ${n} días`, orden:n};
  if(ds!=null && ds>60) return {cls:'red', txt:`${ds} días sin actuación`, orden:-1};
  if(n!=null && n<=7) return {cls:'amb', txt:`Vence en ${n} días`, orden:n};
  if(ds!=null && ds>30) return {cls:'amb', txt:`${ds} días sin actuación`, orden:50};
  return null;
}

const VIEWS = {};

function expedientesCard(list, compact){
  const mats=['Todos',...MATERIAS.filter(m=>S.expedientes.some(e=>e.materia===m))];
  const l=list.filter(e=>filtroMateria==='Todos'||e.materia===filtroMateria);
  return `<div class="card"><h3>Expedientes<span class="lnk" onclick="nuevoExpediente()">+ Nuevo</span></h3>
  <div class="filters">${mats.map(m=>`<span class="${filtroMateria===m?'on':''}" onclick="filtroMateria='${m}';render()">${m}</span>`).join('')}</div>
  ${l.length?l.map(e=>expRow(e)).join(''):'<div class="empty">Sin expedientes en este filtro.</div>'}</div>`;
}
VIEWS.expedientes = r => {
  let list=S.expedientes, title='Expedientes', sub='';
  if(r.id==='urgentes'){ list=S.expedientes.filter(e=>e.estado==='activo'&&urgencia(e)); title='Por vencer o sin impulso'; }
  else if(r.id==='sentencia'){ list=S.expedientes.filter(e=>e.estado==='sentencia'); title='En espera de sentencia'; }
  else if(r.id==='terminados'){ list=S.expedientes.filter(e=>e.estado==='terminado'); title='Expedientes terminados'; }
  else sub=`${list.length} en total`;
  return head(title, sub, '<a href="#/litigios">Litigios</a> · Expedientes', `<button class="btn p" onclick="nuevoExpediente()">+ Nuevo expediente</button>`) + expedientesCard(list);
};

    </div></div>

function accionRow(e,a){
  const [lab,cls]=EST_ACC[a.estado]||EST_ACC.pendiente; const done=a.estado==='terminada';
  const puedeTerminar = a.estado==='aprobada' || (!a.revisa && !a.aprueba && a.estado!=='pendiente');
  const n=a.plazo?daysUntil(a.plazo):null; const plazoStyle = !done&&n!=null&&n<=3?'color:var(--red-t);font-weight:600':!done&&n!=null&&n<=7?'color:var(--amb-t);font-weight:600':'';
  const next = FLUJO_ACC[FLUJO_ACC.indexOf(a.estado)+1];
  const btn = done ? '' : puedeTerminar ? `<button class="btn sm p" onclick="terminarAccion('${e.id}','${a.id}')">Terminar</button>` : next && next!=='terminada' ? `<button class="btn sm" onclick="avanzarAccion('${e.id}','${a.id}')">${next==='elaboracion'?'Iniciar':next==='revision'?'A revisión':'Aprobar'}</button>` : '';
  return `<tr class="${done?'done':''}"><td><b>${esc(a.titulo)}</b><br><span class="mini">${esc(a.tipo)}${a.notas?' · '+esc(a.notas):''}${a.acuse?' · '+esc(a.acuse):''}</span></td><td>${esc(a.responsable||'—')}</td><td style="${plazoStyle}">${a.plazo?fmt(a.plazo):'—'}</td><td>${esc(a.revisa||'—')}</td><td>${esc(a.aprueba||'—')}</td><td><span class="chip ${cls}">${lab}</span></td><td style="white-space:nowrap">${btn} <span class="lnk" onclick="editarAccion('${e.id}','${a.id}')">editar</span></td></tr>`;
}

function nuevoExpediente(){ formModal('Nuevo expediente', expFields({}), v=>{ const e={id:uid(), ...v, estado:'activo', esperandoAuto:false, acciones:[], bitacora:[], documentos:[]}; addBit('expedientes',e,'Se dio de alta el expediente'); persist('expedientes',e); toast('Expediente creado'); go('#/expediente/'+e.id); }); }
function editarExpediente(id){ const e=exp(id); formModal('Editar expediente', expFields(e), v=>{ Object.assign(e,v); persist('expedientes',e); render(); }, {extra:`<button type="button" class="btn danger" onclick="closeModal();confirmModal('¿Eliminar el expediente ${esc(e.numero)}? Esta acción no se puede deshacer.',()=>{removeItem('expedientes','${e.id}');go('#/expedientes');})">Eliminar</button>`}); }
function cambiarEtapa(id){ const e=exp(id); formModal('Cambiar etapa procesal',[{k:'etapa',label:'Etapa',type:'select',options:ETAPAS,value:e.etapa}], v=>{ if(v.etapa!==e.etapa){ addBit('expedientes',e,`Cambió la etapa procesal a: ${v.etapa}`); e.etapa=v.etapa; if(v.etapa==='Citado a sentencia') e.estado='sentencia'; persist('expedientes',e); } render(); }); }

const accFields = a => [
  {k:'titulo',label:'Documento, promoción o acto',required:true,value:a.titulo,placeholder:'Escrito de designación de perito'},

function calcPlazo(){ const f=$('#mf'); const n=prompt('¿Cuántos días hábiles? (se cuentan desde hoy, sin sábados ni domingos; ajusta manualmente si hay días inhábiles del tribunal)'); if(n&&Number(n)>0){ f.plazo.value=addBusinessDays(todayISO(),Number(n)); } }

/* ---------- CORPORATIVO: derivados ---------- */
function vencimientos(){ // eventos corporativos con fecha
  const ev=[];
  S.clientes.forEach(c=>{
    (c.contratos||[]).forEach(k=>{ if(k.vencimiento) ev.push({fecha:k.vencimiento, cliente:c, tipo:'Contrato', txt:`${k.nombre} vence`}); });
    (c.poderes||[]).forEach(p=>{ if(p.vigencia&&!p.revocado) ev.push({fecha:p.vigencia, cliente:c, tipo:'Poder', txt:`Poder de ${p.apoderado} vence`}); });
    (c.cumplimiento||[]).forEach(m=>{ if(m.fecha&&m.estado!=='cumplido') ev.push({fecha:m.fecha, cliente:c, tipo:'Cumplimiento', txt:m.item}); });
    (c.contingencias||[]).forEach(g=>{ if(g.fecha&&g.estado!=='cerrada') ev.push({fecha:g.fecha, cliente:c, tipo:'Contingencia', txt:g.accion}); });
    if(c.dd&&c.dd.proximo) ev.push({fecha:c.dd.proximo, cliente:c, tipo:'Due diligence', txt:'Due diligence semestral'});
  });
  return ev.sort((a,b)=>a.fecha.localeCompare(b.fecha));
}
function chipFecha(f){ const n=daysUntil(f); if(n==null) return ''; return `<span class="chip ${n<0?'red':n<=7?'red':n<=30?'amb':'blu'}">${n<0?'Vencido · ':''}${fmt(f)}</span>`; }
function cliPendientes(c){ let n=0; n+=(c.contingencias||[]).filter(g=>g.estado!=='cerrada').length; n+=(c.cumplimiento||[]).filter(m=>m.estado!=='cumplido'&&m.fecha&&daysUntil(m.fecha)<=30).length; n+=(c.contratos||[]).filter(k=>k.vencimiento&&daysUntil(k.vencimiento)<=30).length; n+=(c.poderes||[]).filter(p=>p.vigencia&&!p.revocado&&daysUntil(p.vigencia)<=30).length; n+=(c.poderes||[]).filter(p=>p.revocado&&!p.inscrito).length; return n; }
function cliRow(c){ const n=cliPendientes(c); const venc=(c.cumplimiento||[]).some(m=>m.estado==='vencido'||(m.estado!=='cumplido'&&m.fecha&&daysUntil(m.fecha)<0)); return `<div class="row click" onclick="go('#/cliente/${c.id}')"><div><b>${esc(c.razon)}</b><div class="m">${esc(c.servicio||'')} · ${(c.contratos||[]).length} contratos · ${esc(c.responsable||'')}</div></div><div class="r">${venc?'<span class="chip red">Vencido</span>':n?`<span class="chip amb">${n} pendiente${n>1?'s':''}</span>`:'<span class="chip grn">Al día</span>'}</div></div>`; }
const ETIQ_TRAM = e => { const i=ETAPAS_TRAM.findIndex(x=>x[0]===e); return ETAPAS_TRAM[i<0?0:i][1]; };
function tramRow(t){ const c=cli(t.clienteId); const bloq=(t.documentos||[]).some(d=>d.bloquea&&d.estado!=='recibido'); const cls=t.etapa==='concluido'?'grn':t.etapa==='prevencion'||bloq?'amb':t.etapa==='documentacion'||t.etapa==='ingreso'?'blu':'gry'; return `<div class="row click" onclick="go('#/tramite/${t.id}')"><div><b>${esc(t.tipo)}${t.descripcion?' · '+esc(t.descripcion):''}</b><div class="m">${c?esc(c.razon):'—'} · ${esc(t.dependencia||'')}</div></div><div class="r"><span class="chip ${cls}">${ETIQ_TRAM(t.etapa)}</span>${t.fechaMeta&&t.etapa!=='concluido'?chipFecha(t.fechaMeta):''}</div></div>`; }

      ${(c.porCelebrar||[]).filter(k=>k.estado!=='firmado').map(k=>{ const [lab,cls]=EST_CON[k.estado]||EST_CON.elaboracion; const next=FLUJO_CON[FLUJO_CON.indexOf(k.estado)+1]; const btn=next==='firmado'?`<button class="btn sm p" onclick="firmarContrato('${c.id}','${k.id}')">Firmado</button>`:next?`<button class="btn sm" onclick="avanzarContrato('${c.id}','${k.id}')">${next==='revision'?'A revisión':next==='aprobacion'?'Por aprobar':'Aprobar'}</button>`:''; return `<tr><td><b>${esc(k.nombre)}</b>${k.notas?`<br><span class="mini">${esc(k.notas)}</span>`:''}</td><td>${esc(k.elabora||'—')}</td><td>${esc(k.revisa||'—')}</td><td>${esc(k.aprueba||'—')}</td><td><span class="chip ${cls}">${lab}</span></td><td style="white-space:nowrap">${btn} <span class="lnk" onclick="editarPorCelebrar('${c.id}','${k.id}')">editar</span></td></tr>`; }).join('')||'<tr><td colspan="6" class="empty">Ninguno en proceso.</td></tr>'}</table></div>
      <div class="note">Flujo: en elaboración → en revisión → por aprobar → aprobado → firmado. Al marcarlo firmado pasa a la matriz de contratos celebrados.</div></div>
    ${tram.length?`<div class="card"><h3>Trámites<span class="lnk" onclick="nuevoTramite('${c.id}')">+ Nuevo</span></h3>${tram.map(tramRow).join('')}</div>`:''}
    <div class="card"><h3>Bitácora del cliente<span class="lnk" onclick="nuevaBitacora('clientes','${c.id}')">+ Anotar</span></h3>
      ${[...(c.bitacora||[])].sort(byDateDesc).slice(0,8).map(b=>`<div class="row"><div><b>${fmt(b.fecha,true)} · ${esc(b.texto)}</b><div class="m">${esc(b.quien)}</div></div></div>`).join('')||'<div class="empty">Sin registros.</div>'}</div>
    <div class="card"><h3>Contingencias en litigio<span class="lnk" onclick="nuevaConting('${c.id}')">+ Registrar</span></h3>
      ${(c.contingencias||[]).map(g=>{ const [lab,cls]=RIESGOS[g.riesgo]||RIESGOS.bajo; return `<div class="row"><div><b>${esc(g.hecho)}</b><div class="m">Acción preventiva: ${esc(g.accion||'—')} · ${esc(g.responsable||'')}${g.fecha?' · '+fmt(g.fecha):''}</div><div class="m"><span class="lnk" onclick="editarConting('${c.id}','${g.id}')">editar</span> · <span class="lnk" onclick="contingAExpediente('${c.id}','${g.id}')">convertir en expediente</span></div></div><div class="r">${g.estado==='cerrada'?'<span class="chip grn">Cerrada</span>':`<span class="chip ${cls}">${lab}</span>`}</div></div>`; }).join('')||'<div class="empty">Sin contingencias.</div>'}</div>
    <div class="card"><h3>Contratos celebrados<span class="lnk" onclick="nuevoContrato('${c.id}')">+ Contrato</span></h3>
      ${[...(c.contratos||[])].sort((a,b)=>(a.vencimiento||'9').localeCompare(b.vencimiento||'9')).map(k=>`<div class="row"><div><b>${esc(k.nombre)}</b><div class="m">${esc(k.contraparte||'')}${k.objeto?' · '+esc(k.objeto):''} · ${k.vencimiento?'vence '+fmt(k.vencimiento,true):'sin vencimiento'}${k.renovacion?' · '+esc(k.renovacion):''}</div><div class="m"><span class="lnk" onclick="editarContrato('${c.id}','${k.id}')">editar</span></div></div><div class="r">${!k.firmado?'<span class="chip amb">Sin firma</span>':k.vencimiento&&daysUntil(k.vencimiento)<=90?chipFecha(k.vencimiento):'<span class="chip grn">Vigente</span>'}</div></div>`).join('')||'<div class="empty">Sin contratos registrados.</div>'}</div>
    ${exps.length?`<div class="card"><h3>Litigios de este cliente</h3>${exps.map(e=>expRow(e)).join('')}</div>`:''}
  </div></div>`;
};

/* ---------- CORPORATIVO: acciones ---------- */
const cliFields = c => [
  {k:'razon',label:'Razón social',required:true,value:c.razon},
  {k:'rfc',label:'RFC',value:c.rfc,half:true},{k:'desde',label:'Cliente desde (año)',value:c.desde,half:true},
  {k:'representante',label:'Representante legal',value:c.representante,half:true},{k:'contacto',label:'Contacto operativo',value:c.contacto,half:true,placeholder:'Nombre · teléfono o correo'},
  {k:'servicio',label:'Tipo de servicio',type:'select',options:['Iguala mensual','Por proyecto'],value:c.servicio||'Iguala mensual',half:true},
  {k:'responsable',label:'Responsable interno',type:'select',options:userOpts(true),value:c.responsable||quien(),half:true},
];
function nuevoCliente(){ formModal('Nuevo cliente', cliFields({}), v=>{ const c={id:uid(), ...v, documentos:[], contratos:[], porCelebrar:[], poderes:[], contingencias:[], cumplimiento:[], dd:{ultimo:'',proximo:'',hallazgos:0,abiertos:0}, bitacora:[]}; addBit('clientes',c,'Se dio de alta al cliente'); persist('clientes',c); toast('Cliente creado'); go('#/cliente/'+c.id); }); }
function editarCliente(id){ const c=cli(id); formModal('Editar cliente', cliFields(c), v=>{ Object.assign(c,v); persist('clientes',c); render(); }, {extra:`<button type="button" class="btn danger" onclick="closeModal();confirmModal('¿Eliminar este cliente con todo su contenido?',()=>{removeItem('clientes','${id}');go('#/clientes');})">Eliminar</button>`}); }
function nuevoDocCliente(id){ const c=cli(id); formModal('Registrar documento',[{k:'carpeta',label:'Carpeta',type:'select',options:CARPETAS},{k:'nombre',label:'Documento',required:true,placeholder:'Escritura 4,512 · Acta de asamblea abril 2026'},{k:'fecha',label:'Fecha',type:'date',value:todayISO(),required:true}], v=>{ c.documentos=c.documentos||[]; c.documentos.push({id:uid(),...v}); persist('clientes',c); render(); }); }
function quitarDocCliente(id,did){ const c=cli(id); confirmModal('¿Quitar este documento de la lista?',()=>{ c.documentos=c.documentos.filter(d=>d.id!==did); persist('clientes',c); render(); },'Quitar'); }
function editarDD(id){ const c=cli(id); const d=c.dd||{}; formModal('Due diligence semestral',[{k:'ultimo',label:'Último entregado',type:'date',value:d.ultimo,half:true},{k:'proximo',label:'Próximo programado',type:'date',value:d.proximo,half:true},{k:'hallazgos',label:'Hallazgos del último',type:'number',value:d.hallazgos||0,half:true},{k:'abiertos',label:'Hallazgos abiertos',type:'number',value:d.abiertos||0,half:true}], v=>{ c.dd={ultimo:v.ultimo,proximo:v.proximo,hallazgos:Number(v.hallazgos)||0,abiertos:Number(v.abiertos)||0}; persist('clientes',c); render(); }); }
const podFields = p => [{k:'apoderado',label:'Apoderado',required:true,value:p.apoderado},{k:'facultades',label:'Facultades',value:p.facultades,placeholder:'Pleitos y cobranzas, actos de administración…'},{k:'notaria',label:'Notaría',value:p.notaria,half:true},{k:'fecha',label:'Fecha de otorgamiento',type:'date',value:p.fecha,half:true},{k:'vigencia',label:'Vigencia (vacío si es indefinida)',type:'date',value:p.vigencia},{k:'inscrito',label:'Inscrito en el Registro Público',type:'checkbox',value:p.inscrito},{k:'revocado',label:'Revocado',type:'checkbox',value:p.revocado}];
function nuevoPoder(id){ const c=cli(id); formModal('Nuevo poder', podFields({inscrito:true}), v=>{ c.poderes=c.poderes||[]; c.poderes.push({id:uid(),...v}); persist('clientes',c); render(); }); }
function editarPoder(id,pid){ const c=cli(id); const p=c.poderes.find(x=>x.id===pid); formModal('Editar poder', podFields(p), v=>{ Object.assign(p,v); persist('clientes',c); render(); }, {extra:`<button type="button" class="btn danger" onclick="closeModal();const c=cli('${id}');c.poderes=c.poderes.filter(x=>x.id!=='${pid}');persist('clientes',c);render()">Eliminar</button>`}); }
function nuevoCumpl(id){ const c=cli(id); formModal('Obligación corporativa',[{k:'item',label:'Obligación',required:true,placeholder:'Asamblea ordinaria anual 2027 · Aviso de beneficiario controlador'},{k:'fecha',label:'Fecha límite',type:'date'}], v=>{ c.cumplimiento=c.cumplimiento||[]; c.cumplimiento.push({id:uid(),item:v.item,fecha:v.fecha,estado:'pendiente'}); persist('clientes',c); render(); }); }
function toggleCumpl(id,mid){ const c=cli(id); const m=c.cumplimiento.find(x=>x.id===mid); m.estado=m.estado==='cumplido'?'pendiente':'cumplido'; if(m.estado==='cumplido') addBit('clientes',c,`Cumplido: ${m.item}`); persist('clientes',c); render(); }
const contFields = g => [{k:'hecho',label:'Hecho o riesgo detectado',required:true,type:'textarea',value:g.hecho},{k:'riesgo',label:'Nivel de riesgo',type:'select',options:[['alto','Alto'],['medio','Medio'],['bajo','Bajo']],value:g.riesgo||'medio',half:true},{k:'fecha',label:'Fecha para la acción',type:'date',value:g.fecha,half:true},{k:'accion',label:'Acción preventiva',value:g.accion},{k:'responsable',label:'Responsable',type:'select',options:userOpts(true),value:g.responsable||quien()},{k:'estado',label:'Estado',type:'select',options:[['abierta','Abierta'],['cerrada','Cerrada']],value:g.estado||'abierta'}];
function nuevaConting(id){ const c=cli(id); formModal('Registrar contingencia', contFields({}), v=>{ c.contingencias=c.contingencias||[]; c.contingencias.push({id:uid(),...v}); addBit('clientes',c,`Contingencia registrada: ${v.hecho}`); persist('clientes',c); render(); }); }
function editarConting(id,gid){ const c=cli(id); const g=c.contingencias.find(x=>x.id===gid); formModal('Editar contingencia', contFields(g), v=>{ Object.assign(g,v); persist('clientes',c); render(); }, {extra:`<button type="button" class="btn danger" onclick="closeModal();const c=cli('${id}');c.contingencias=c.contingencias.filter(x=>x.id!=='${gid}');persist('clientes',c);render()">Eliminar</button>`}); }
function contingAExpediente(id,gid){ const c=cli(id); const g=c.contingencias.find(x=>x.id===gid); formModal('Convertir en expediente de litigio', expFields({cliente:c.razon, responsable:c.responsable, contraparte:'', tipo:''}), v=>{ const e={id:uid(), ...v, estado:'activo', esperandoAuto:false, acciones:[], bitacora:[], documentos:[]}; addBit('expedientes',e,`Creado a partir de la contingencia: ${g.hecho}`); persist('expedientes',e); g.estado='cerrada'; addBit('clientes',c,`La contingencia "${g.hecho}" pasó a litigio (${e.numero})`); persist('clientes',c); go('#/expediente/'+e.id); }); }
const konFields = k => [{k:'nombre',label:'Contrato',required:true,value:k.nombre},{k:'contraparte',label:'Contraparte',value:k.contraparte,half:true},{k:'objeto',label:'Objeto',value:k.objeto,half:true},{k:'inicio',label:'Inicio',type:'date',value:k.inicio,half:true},{k:'vencimiento',label:'Vencimiento',type:'date',value:k.vencimiento,half:true},{k:'renovacion',label:'Renovación',type:'select',options:['Automática anual','Por convenio','No aplica'],value:k.renovacion||'Por convenio'},{k:'firmado',label:'Firmado por todas las partes',type:'checkbox',value:k.firmado!==false}];
function nuevoContrato(id){ const c=cli(id); formModal('Contrato celebrado', konFields({firmado:true}), v=>{ c.contratos=c.contratos||[]; c.contratos.push({id:uid(),...v}); persist('clientes',c); render(); }); }
function editarContrato(id,kid){ const c=cli(id); const k=c.contratos.find(x=>x.id===kid); formModal('Editar contrato', konFields(k), v=>{ Object.assign(k,v); persist('clientes',c); render(); }, {extra:`<button type="button" class="btn danger" onclick="closeModal();const c=cli('${id}');c.contratos=c.contratos.filter(x=>x.id!=='${kid}');persist('clientes',c);render()">Eliminar</button>`}); }
const pcFields = k => [{k:'nombre',label:'Contrato',required:true,value:k.nombre},{k:'elabora',label:'Elabora',value:k.elabora||quien(),half:true,hint:'Puede ser alguien externo (notaría, contraparte)'},{k:'revisa',label:'Revisa',type:'select',options:userOpts(true),value:k.revisa||'',half:true},{k:'aprueba',label:'Aprueba',type:'select',options:userOpts(true),value:k.aprueba||''},{k:'notas',label:'Notas',value:k.notas}];
function nuevoPorCelebrar(id){ const c=cli(id); formModal('Contrato por celebrar', pcFields({}), v=>{ c.porCelebrar=c.porCelebrar||[]; c.porCelebrar.push({id:uid(),...v,estado:'elaboracion'}); persist('clientes',c); render(); }); }
function editarPorCelebrar(id,kid){ const c=cli(id); const k=c.porCelebrar.find(x=>x.id===kid); formModal('Editar contrato por celebrar', [...pcFields(k),{k:'estado',label:'Estado',type:'select',options:Object.entries(EST_CON).map(([a,b])=>[a,b[0]]),value:k.estado}], v=>{ Object.assign(k,v); persist('clientes',c); render(); }, {extra:`<button type="button" class="btn danger" onclick="closeModal();const c=cli('${id}');c.porCelebrar=c.porCelebrar.filter(x=>x.id!=='${kid}');persist('clientes',c);render()">Eliminar</button>`}); }
function avanzarContrato(id,kid){ const c=cli(id); const k=c.porCelebrar.find(x=>x.id===kid); const next=FLUJO_CON[FLUJO_CON.indexOf(k.estado)+1]; if(!next||next==='firmado') return; if(next==='aprobado' && k.aprueba && k.aprueba!==quien() && !confirm(`Este contrato lo aprueba ${k.aprueba}. ¿Aprobar de todos modos como ${quien()}?`)) return; k.estado=next; if(next==='aprobado') addBit('clientes',c,`Aprobado: ${k.nombre}`); persist('clientes',c); render(); }
function firmarContrato(id,kid){ const c=cli(id); const k=c.porCelebrar.find(x=>x.id===kid); formModal('Contrato firmado', konFields({nombre:k.nombre, firmado:true, inicio:todayISO()}), v=>{ c.contratos=c.contratos||[]; c.contratos.push({id:uid(),...v}); c.porCelebrar=c.porCelebrar.filter(x=>x.id!==kid); addBit('clientes',c,`Firmado: ${v.nombre}`); persist('clientes',c); toast('Pasó a contratos celebrados'); render(); }, {submit:'Registrar firma'}); }
function informeCliente(id){ const c=cli(id); const ev=vencimientos().filter(e=>e.cliente.id===c.id&&daysUntil(e.fecha)<=90); const pc=(c.porCelebrar||[]).filter(k=>k.estado!=='firmado'); const cont=(c.contingencias||[]).filter(g=>g.estado!=='cerrada'); const tram=S.tramites.filter(t=>t.clienteId===c.id&&t.etapa!=='concluido');
  const txt=`Estimado ${c.representante||'cliente'}:\n\nLe comparto el estado de los asuntos corporativos de ${c.razon} al ${fmt(todayISO(),true)}.\n\n${ev.length?`Vencimientos en los próximos 90 días:\n${ev.map(e=>`- ${e.txt} (${fmt(e.fecha,true)})`).join('\n')}\n\n`:''}${pc.length?`Contratos en proceso:\n${pc.map(k=>`- ${k.nombre}: ${(EST_CON[k.estado]||EST_CON.elaboracion)[0].toLowerCase()}`).join('\n')}\n\n`:''}${cont.length?`Contingencias que estamos atendiendo:\n${cont.map(g=>`- ${g.hecho}. Acción: ${g.accion||'en análisis'}`).join('\n')}\n\n`:''}${tram.length?`Trámites en curso:\n${tram.map(t=>`- ${t.tipo}${t.descripcion?' ('+t.descripcion+')':''}: ${ETIQ_TRAM(t.etapa).toLowerCase()}`).join('\n')}\n\n`:''}Quedo atento a cualquier duda.\n\n${quien()}`;
  textModal('Informe al cliente', txt, 'Texto listo para pegar en un correo. Ajusta lo que haga falta antes de enviarlo.'); }
/* ---------- TRÁMITES ---------- */
VIEWS.tramites = () => head('Trámites para clientes', `${S.tramites.filter(t=>t.etapa!=='concluido').length} en curso`, '<a href="#/corporativo">Servicios corporativos</a> · Trámites', `<button class="btn p" onclick="nuevoTramite()">+ Nuevo trámite</button>`) + `<div class="card"><h3>En curso</h3>${S.tramites.filter(t=>t.etapa!=='concluido').map(tramRow).join('')||'<div class="empty">Sin trámites en curso.</div>'}</div><div class="card"><h3>Concluidos</h3>${S.tramites.filter(t=>t.etapa==='concluido').map(tramRow).join('')||'<div class="empty">Ninguno.</div>'}</div>`;
VIEWS.tramite = r => {
  const t=tra(r.id); if(!t) return head('Trámite no encontrado','','<a href="#/tramites">Trámites</a>');
  const c=cli(t.clienteId); const docs=t.documentos||[]; const rec=docs.filter(d=>d.estado==='recibido').length; const idx=ETAPAS_TRAM.findIndex(x=>x[0]===t.etapa);
  const otros=S.tramites.filter(x=>x.clienteId===t.clienteId&&x.id!==t.id);
  return head(t.tipo, t.descripcion, `<a href="#/corporativo">Servicios corporativos</a> · <a href="#/tramites">Trámites</a>${c?` · <a href="#/cliente/${c.id}">${esc(c.razon)}</a>`:''}`) + `
  <div class="hdr"><div class="top"><div><div class="t">${esc(t.tipo)}${t.descripcion?' · '+esc(t.descripcion):''}</div><div class="s">Cliente: ${c?esc(c.razon):'—'} · Responsable interno: ${esc(t.responsable||'—')}</div></div>
    <div class="acts"><span class="chip ${t.etapa==='concluido'?'grn':'blu'}">${ETIQ_TRAM(t.etapa)}</span><button class="btn" onclick="editarTramite('${t.id}')">Editar</button><button class="btn" onclick="informeTramite('${t.id}')">Informe al cliente</button>${idx>0?`<button class="btn" onclick="etapaTramite('${t.id}',-1)">Regresar etapa</button>`:''}${t.etapa!=='concluido'?`<button class="btn p" onclick="etapaTramite('${t.id}',1)">Avanzar a ${ETAPAS_TRAM[idx+1][1].toLowerCase()}</button>`:''}</div></div>
    <div class="grid">
      <div><div class="l">Dependencia</div><div class="v">${esc(t.dependencia||'—')}</div></div>
      <div><div class="l">${t.etapa==='documentacion'?'Fecha meta de ingreso':'Fecha de ingreso'}</div><div class="v" style="${t.fechaMeta&&daysUntil(t.fechaMeta)<=7&&t.etapa==='documentacion'?'color:var(--amb-t)':''}">${t.fechaMeta?fmt(t.fechaMeta,true):'—'}</div></div>
      <div><div class="l">Plazo de respuesta</div><div class="v">${esc(t.plazoRespuesta||'—')}</div></div>
      <div><div class="l">Derechos estimados</div><div class="v">${money(t.derechos)}</div></div>
    </div>
    <div class="steps">${ETAPAS_TRAM.slice(0,5).map((s,i)=>`<div class="step ${i<idx||t.etapa==='concluido'?'done':i===idx?'on':''}">${s[1]}</div>`).join('')}</div></div>
  <div class="cols c21"><div>
    <div class="card"><h3>Documentación requerida<span>${rec} de ${docs.length} · <span class="lnk" onclick="nuevoDocTram('${t.id}')">+ Documento</span></span></h3>
      <div class="tw"><table><tr><th style="min-width:200px">Documento</th><th>Quién lo entrega</th><th>Fecha</th><th>Estado</th><th></th></tr>
      ${docs.map(d=>`<tr class="${d.estado==='recibido'?'done':''}"><td><span class="chk ${d.estado==='recibido'?'on':''}" onclick="toggleDocTram('${t.id}','${d.id}')">${d.estado==='recibido'?'✓':''}</span>${esc(d.nombre)}</td><td>${esc(d.entrega||'—')}</td><td>${d.fecha?fmt(d.fecha):'—'}</td><td>${d.estado==='recibido'?'<span class="chip grn">Recibido</span>':d.bloquea?'<span class="chip red">Bloquea</span>':/cliente/i.test(d.entrega||'')?'<span class="chip gry">Pendiente</span>':'<span class="chip amb">Externo</span>'}</td><td><span class="lnk" onclick="editarDocTram('${t.id}','${d.id}')">editar</span></td></tr>`).join('')||'<tr><td colspan="5" class="empty">Sin documentos. Agrega los que pide la dependencia.</td></tr>'}</table></div>
      <div class="note">"Bloquea" marca el documento que detiene todo el trámite, normalmente uno que depende de otro trámite previo.</div></div>
    <div class="card"><h3>Bitácora del trámite<span class="lnk" onclick="nuevaBitacora('tramites','${t.id}')">+ Anotar</span></h3>${[...(t.bitacora||[])].sort(byDateDesc).map(b=>`<div class="row"><div><b>${fmt(b.fecha,true)} · ${esc(b.texto)}</b><div class="m">${esc(b.quien)}</div></div></div>`).join('')||'<div class="empty">Sin registros.</div>'}</div>
  </div><div>
    <div class="card"><h3>Personas coadyuvantes<span class="lnk" onclick="nuevoCoad('${t.id}')">+ Agregar</span></h3>
      ${(t.coadyuvantes||[]).map(p=>{ const pend=docs.filter(d=>d.estado!=='recibido'&&(d.entrega||'').toLowerCase().includes((p.nombre||'').toLowerCase().split(' ').slice(-1)[0].toLowerCase())).length; return `<div class="row"><div style="display:flex;align-items:center"><span class="av">${initials(p.nombre)}</span><div><b>${esc(p.nombre)}</b><div class="m">${esc(p.funcion||'')}${p.contacto?' · '+esc(p.contacto):''} · <span class="lnk" onclick="editarCoad('${t.id}','${p.id}')">editar</span></div></div></div><div class="r">${pend?`<span class="chip amb">${pend} pendiente${pend>1?'s':''}</span>`:'<span class="chip grn">Al día</span>'}</div></div>`; }).join('')||'<div class="empty">Sin coadyuvantes. Agrega ingenieros, gestores, arquitectos o contactos del cliente.</div>'}</div>
    ${otros.length?`<div class="card"><h3>Otros trámites del cliente</h3>${otros.map(tramRow).join('')}</div>`:''}
  </div></div>`;
};
const tramFields = t => [
  {k:'clienteId',label:'Cliente',type:'select',options:S.clientes.map(c=>[c.id,c.razon]),value:t.clienteId||(S.clientes[0]&&S.clientes[0].id),required:true},
  {k:'tipo',label:'Tipo de trámite',type:'select',options:Object.keys(TIPOS_TRAM),value:t.tipo||'Licencia de construcción',half:true,hint:'Al crearlo se precarga la lista de documentos usual'},
  {k:'descripcion',label:'Descripción breve',value:t.descripcion,half:true,placeholder:'Nave 2, El Marqués'},
  {k:'dependencia',label:'Dependencia',value:t.dependencia,placeholder:'Desarrollo Urbano, Municipio de…'},
  {k:'responsable',label:'Responsable interno',type:'select',options:userOpts(true),value:t.responsable||quien(),half:true},
  {k:'fechaMeta',label:'Fecha meta de ingreso',type:'date',value:t.fechaMeta,half:true},
  {k:'plazoRespuesta',label:'Plazo de respuesta de la autoridad',value:t.plazoRespuesta,half:true,placeholder:'15 días hábiles'},
  {k:'derechos',label:'Derechos estimados (MXN)',type:'number',value:t.derechos,half:true},
];
function nuevoTramite(clienteId){ if(!S.clientes.length){ toast('Primero da de alta un cliente'); return; } formModal('Nuevo trámite', tramFields({clienteId}), v=>{ const t={id:uid(), ...v, etapa:'documentacion', documentos:(TIPOS_TRAM[v.tipo]||[]).map(n=>({id:uid(),nombre:n,entrega:'',fecha:'',estado:'pendiente',bloquea:false})), coadyuvantes:[], bitacora:[]}; addBit('tramites',t,'Se abrió el trámite'); persist('tramites',t); toast('Trámite creado'); go('#/tramite/'+t.id); }); }
function editarTramite(id){ const t=tra(id); formModal('Editar trámite', tramFields(t), v=>{ Object.assign(t,v); persist('tramites',t); render(); }, {extra:`<button type="button" class="btn danger" onclick="closeModal();confirmModal('¿Eliminar este trámite?',()=>{removeItem('tramites','${id}');go('#/tramites');})">Eliminar</button>`}); }
function etapaTramite(id,dir){ const t=tra(id); const i=ETAPAS_TRAM.findIndex(x=>x[0]===t.etapa); const j=i+dir; if(j<0||j>=ETAPAS_TRAM.length) return; if(dir>0&&t.etapa==='documentacion'){ const falt=(t.documentos||[]).filter(d=>d.estado!=='recibido'); if(falt.length&&!confirm(`Faltan ${falt.length} documentos por recibir. ¿Avanzar de todos modos?`)) return; } t.etapa=ETAPAS_TRAM[j][0]; addBit('tramites',t,`Etapa: ${ETAPAS_TRAM[j][1]}`); persist('tramites',t); render(); }
const docTramFields = d => [{k:'nombre',label:'Documento',required:true,value:d.nombre},{k:'entrega',label:'Quién lo entrega',value:d.entrega,placeholder:'Cliente · Despacho · Ing. Carlos Vega (DRO)',half:true},{k:'fecha',label:'Fecha compromiso o de recepción',type:'date',value:d.fecha,half:true},{k:'estado',label:'Estado',type:'select',options:[['pendiente','Pendiente'],['recibido','Recibido']],value:d.estado||'pendiente'},{k:'bloquea',label:'Bloquea el trámite (depende de otro trámite previo)',type:'checkbox',value:d.bloquea}];
function nuevoDocTram(id){ const t=tra(id); formModal('Documento requerido', docTramFields({}), v=>{ t.documentos=t.documentos||[]; t.documentos.push({id:uid(),...v}); persist('tramites',t); render(); }); }
function editarDocTram(id,did){ const t=tra(id); const d=t.documentos.find(x=>x.id===did); formModal('Editar documento', docTramFields(d), v=>{ Object.assign(d,v); persist('tramites',t); render(); }, {extra:`<button type="button" class="btn danger" onclick="closeModal();const t=tra('${id}');t.documentos=t.documentos.filter(x=>x.id!=='${did}');persist('tramites',t);render()">Eliminar</button>`}); }
function toggleDocTram(id,did){ const t=tra(id); const d=t.documentos.find(x=>x.id===did); d.estado=d.estado==='recibido'?'pendiente':'recibido'; if(d.estado==='recibido'){ d.fecha=d.fecha||todayISO(); addBit('tramites',t,`Se recibió: ${d.nombre}`); } persist('tramites',t); render(); }
const coadFields = p => [{k:'nombre',label:'Nombre',required:true,value:p.nombre},{k:'funcion',label:'Función',value:p.funcion,placeholder:'Director responsable de obra · Gestor · Contacto del cliente'},{k:'contacto',label:'Contacto',value:p.contacto}];
function nuevoCoad(id){ const t=tra(id); formModal('Persona coadyuvante', coadFields({}), v=>{ t.coadyuvantes=t.coadyuvantes||[]; t.coadyuvantes.push({id:uid(),...v}); persist('tramites',t); render(); }); }
function editarCoad(id,pid){ const t=tra(id); const p=t.coadyuvantes.find(x=>x.id===pid); formModal('Editar coadyuvante', coadFields(p), v=>{ Object.assign(p,v); persist('tramites',t); render(); }, {extra:`<button type="button" class="btn danger" onclick="closeModal();const t=tra('${id}');t.coadyuvantes=t.coadyuvantes.filter(x=>x.id!=='${pid}');persist('tramites',t);render()">Quitar</button>`}); }
function informeTramite(id){ const t=tra(id); const c=cli(t.clienteId); const docs=t.documentos||[]; const falt=docs.filter(d=>d.estado!=='recibido');
  const txt=`Estimado ${c&&c.representante?c.representante:'cliente'}:\n\nLe informo el avance del trámite de ${t.tipo.toLowerCase()}${t.descripcion?' ('+t.descripcion+')':''} ante ${t.dependencia||'la dependencia'}.\n\nEtapa actual: ${ETIQ_TRAM(t.etapa).toLowerCase()}.${t.fechaMeta?` ${t.etapa==='documentacion'?'Fecha meta de ingreso':'Fecha de ingreso'}: ${fmt(t.fechaMeta,true)}.`:''}${t.plazoRespuesta?` Plazo de respuesta de la autoridad: ${t.plazoRespuesta}.`:''}\n\nDocumentación: ${docs.length-falt.length} de ${docs.length} documentos recibidos.${falt.length?`\nPendientes:\n${falt.map(d=>`- ${d.nombre}${d.entrega?` (entrega ${d.entrega})`:''}${d.bloquea?' · detiene el trámite':''}`).join('\n')}`:''}\n\nQuedo atento a cualquier duda.\n\n${quien()}`;
  textModal('Informe al cliente', txt, 'Texto listo para pegar en un correo.'); }

/* ---------- CALENDARIO ---------- */
VIEWS.calendario = () => {
  const ev=[];
  S.expedientes.filter(e=>e.estado!=='terminado').forEach(e=>{ if(e.audiencia) ev.push({fecha:e.audiencia, tipo:'Audiencia', txt:`${e.numero} · ${e.cliente}`, go:'#/expediente/'+e.id, cls:'blu'}); pendientes(e).forEach(a=>{ if(a.plazo) ev.push({fecha:a.plazo, tipo:'Plazo', txt:`${a.titulo} · ${e.numero} · ${a.responsable||''}`, go:'#/expediente/'+e.id, cls:'amb'}); }); });
  vencimientos().forEach(v=>ev.push({fecha:v.fecha, tipo:v.tipo, txt:`${v.txt} · ${v.cliente.razon}`, go:'#/cliente/'+v.cliente.id, cls:'gry'}));
  S.tramites.filter(t=>t.etapa!=='concluido').forEach(t=>{ if(t.fechaMeta&&t.etapa==='documentacion') ev.push({fecha:t.fechaMeta, tipo:'Trámite', txt:`Ingresar ${t.tipo.toLowerCase()} · ${(cli(t.clienteId)||{}).razon||''}`, go:'#/tramite/'+t.id, cls:'blu'}); (t.documentos||[]).filter(d=>d.estado!=='recibido'&&d.fecha).forEach(d=>ev.push({fecha:d.fecha, tipo:'Documento', txt:`${d.nombre} · ${d.entrega||''} · ${t.tipo}`, go:'#/tramite/'+t.id, cls:'gry'})); });
  ev.sort((a,b)=>a.fecha.localeCompare(b.fecha));
  const T=todayISO(); const venc=ev.filter(e=>e.fecha<T); const prox=ev.filter(e=>e.fecha>=T&&daysUntil(e.fecha)<=120);
  const dias=[...new Set(prox.map(e=>e.fecha))];
  const item=e=>`<div class="row click" onclick="go('${e.go}')"><div><b>${esc(e.txt)}</b></div><div class="r"><span class="chip ${e.cls}">${esc(e.tipo)}</span></div></div>`;
  return head('Calendario', 'audiencias, plazos y vencimientos', '') + `<div class="cols c2"><div>
    ${venc.length?`<div class="card"><h3 style="color:var(--red-t)">Vencidos sin atender</h3>${venc.map(e=>`<div class="row click" onclick="go('${e.go}')"><div><b>${esc(e.txt)}</b><div class="m">${fmt(e.fecha,true)}</div></div><div class="r"><span class="chip red">${esc(e.tipo)}</span></div></div>`).join('')}</div>`:''}
    ${dias.slice(0,Math.ceil(dias.length/2)).map(d=>`<div class="card cal-day ${daysUntil(d)<=3?'over':''}"><h3>${fmtLong(d)}${daysUntil(d)===0?' (hoy)':daysUntil(d)===1?' (mañana)':''}</h3>${prox.filter(e=>e.fecha===d).map(item).join('')}</div>`).join('')}
  </div><div>${dias.slice(Math.ceil(dias.length/2)).map(d=>`<div class="card"><h3>${fmtLong(d)}</h3>${prox.filter(e=>e.fecha===d).map(item).join('')}</div>`).join('')}</div></div>${!ev.length?'<div class="card"><div class="empty">Sin fechas registradas.</div></div>':''}`;
};

/* ---------- EQUIPO ---------- */
VIEWS.equipo = () => {
  const cards=S.usuarios.map(u=>{
    const n=u.nombre; const items=[];
    S.expedientes.filter(e=>e.estado!=='terminado').forEach(e=>pendientes(e).forEach(a=>{ const rol=a.estado==='revision'&&a.revisa===n?'Revisar':a.estado==='aprobada'&&a.responsable===n?'Presentar':(a.estado==='revision'||a.estado==='aprobada')&&a.aprueba===n&&a.estado==='revision'&&!a.revisa?'Aprobar':a.estado==='revision'&&a.aprueba===n&&a.revisa===n?'Revisar y aprobar':(a.responsable===n&&['pendiente','elaboracion'].includes(a.estado))?'Elaborar':null; if(rol) items.push({txt:`${a.titulo} · ${e.numero}`, sub:a.plazo?fmt(a.plazo):'sin plazo', go:'#/expediente/'+e.id, chip:rol, cls:a.plazo&&daysUntil(a.plazo)<=3?'red':a.plazo&&daysUntil(a.plazo)<=7?'amb':'blu', o:a.plazo||'9'}); }));
    S.clientes.forEach(c=>(c.porCelebrar||[]).filter(k=>k.estado!=='firmado').forEach(k=>{ const rol=k.estado==='elaboracion'&&k.elabora===n?'Elaborar':k.estado==='revision'&&k.revisa===n?'Revisar':k.estado==='aprobacion'&&k.aprueba===n?'Aprobar':null; if(rol) items.push({txt:`${k.nombre} · ${c.razon}`, sub:'contrato', go:'#/cliente/'+c.id, chip:rol, cls:'blu', o:'8'}); }));
    S.clientes.forEach(c=>(c.contingencias||[]).filter(g=>g.estado!=='cerrada'&&g.responsable===n).forEach(g=>items.push({txt:`${g.accion||g.hecho} · ${c.razon}`, sub:g.fecha?fmt(g.fecha):'contingencia', go:'#/cliente/'+c.id, chip:'Prevenir', cls:g.riesgo==='alto'?'red':'amb', o:g.fecha||'9'})));
    S.tramites.filter(t=>t.etapa!=='concluido'&&t.responsable===n).forEach(t=>items.push({txt:`${t.tipo} · ${(cli(t.clienteId)||{}).razon||''}`, sub:ETIQ_TRAM(t.etapa), go:'#/tramite/'+t.id, chip:'Trámite', cls:'gry', o:t.fechaMeta||'9'}));
    items.sort((a,b)=>a.o.localeCompare(b.o));
    return `<div class="card"><h3><span><span class="av">${initials(n)}</span>${esc(n)} <span class="mini">· ${esc(u.rol||'')}</span></span><span class="mini">${items.length} tarea${items.length!==1?'s':''}</span></h3>${items.map(i=>`<div class="row click" onclick="go('${i.go}')"><div><b>${esc(i.txt)}</b><div class="m">${esc(i.sub)}</div></div><div class="r"><span class="chip ${i.cls}">${i.chip}</span></div></div>`).join('')||'<div class="empty">Sin pendientes.</div>'}</div>`;
  });
  return head('Equipo y tareas', 'lo que cada quien tiene en la mesa', '', `<button class="btn" onclick="go('#/config')">Administrar equipo</button>`) + (cards.length?`<div class="cols c2"><div>${cards.filter((_,i)=>i%2===0).join('')}</div><div>${cards.filter((_,i)=>i%2===1).join('')}</div></div>`:'<div class="card"><div class="empty">Da de alta a tu equipo en Configuración.</div></div>');
};

/* ---------- CONFIGURACIÓN ---------- */
VIEWS.config = () => head('Configuración','', '') + `<div class="cols c2"><div>
  <div class="card"><h3>Equipo<span class="lnk" onclick="nuevoUsuario()">+ Agregar</span></h3>${S.usuarios.map(u=>`<div class="row"><div style="display:flex;align-items:center"><span class="av">${initials(u.nombre)}</span><div><b>${esc(u.nombre)}</b><div class="m">${esc(u.rol||'')}</div></div></div><div class="r"><span class="lnk" onclick="editarUsuario('${u.id}')">editar</span></div></div>`).join('')||'<div class="empty">Sin integrantes. Agrega al menos a quien elabora, quien revisa y quien aprueba.</div>'}</div>
  <div class="card"><h3>Datos</h3><div class="note">${db?'Los datos se comparten con todos los integrantes de tu organización que abran esta página.':'Los datos viven en este navegador. Para pasarlos a otra persona, exporta e importa el respaldo.'}</div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;padding-bottom:12px"><button class="btn" onclick="cargarEjemplo()">Cargar datos de ejemplo</button><button class="btn" onclick="exportar()">Exportar respaldo</button><button class="btn" onclick="importar()">Importar respaldo</button><button class="btn danger" onclick="confirmModal('¿Borrar todos los datos del prototipo?',borrarTodo,'Borrar todo')">Borrar todo</button></div></div>
  </div><div>
  <div class="card"><h3>Apariencia</h3><div class="row"><div><b>Tema</b><div class="m">Sigue al sistema, o fíjalo.</div></div><div class="r"><select id="temaSel" onchange="setTema(this.value)"><option value="">Automático</option><option value="light">Claro</option><option value="dark">Oscuro</option></select></div></div></div>
  <div class="card"><h3>Cómo funciona este prototipo</h3><div class="note">Cada acción de un expediente sigue el flujo pendiente → en elaboración → en revisión → aprobada → terminada; la casilla de terminada exige la aprobación previa. Al terminar una promoción o escrito, el expediente queda "esperando auto" hasta que se registra el acuerdo. Los plazos se marcan en rojo a tres días y en ámbar a siete; un expediente sin actuación en 30 días se marca en ámbar y en 60 en rojo. Los contratos por celebrar siguen el mismo flujo y al firmarse pasan a la matriz de contratos. Los archivos (PDF de las constancias) todavía no se suben aquí: se registra nombre y fecha, y el archivo vive en el repositorio del despacho.</div></div>
  </div></div>`;
function nuevoUsuario(){ formModal('Integrante del equipo',[{k:'nombre',label:'Nombre',required:true,placeholder:'Lic. Nombre Apellido'},{k:'rol',label:'Rol',placeholder:'Abogado, auxiliar, socio…'}], v=>{ const u={id:uid(),...v}; persist('usuarios',u); if(!yo()) setYo(u.nombre); render(); }); }
function editarUsuario(id){ const u=S.usuarios.find(x=>x.id===id); formModal('Editar integrante',[{k:'nombre',label:'Nombre',required:true,value:u.nombre},{k:'rol',label:'Rol',value:u.rol}], v=>{ Object.assign(u,v); persist('usuarios',u); render(); }, {extra:`<button type="button" class="btn danger" onclick="closeModal();removeItem('usuarios','${id}');render()">Quitar</button>`}); }
function exportar(){ textModal('Respaldo (JSON)', JSON.stringify(S), 'Copia este texto y guárdalo. Para restaurarlo en otro navegador usa "Importar respaldo".'); }
function importar(){ openModal(`<h2>Importar respaldo</h2><div class="note">Pega aquí el JSON exportado. Reemplaza los datos actuales.</div><div class="f"><textarea id="imp" style="min-height:200px"></textarea></div><div class="err" id="ierr"></div><div class="macts"><button class="btn" id="ic">Cancelar</button><button class="btn p" id="io">Importar</button></div>`); $('#ic').onclick=closeModal; $('#io').onclick=()=>{ try{ const o=JSON.parse($('#imp').value); if(!o||typeof o!=='object') throw 0; KINDS.forEach(k=>{ S[k]=Array.isArray(o[k])?o[k]:[]; }); lsSave(); if(db) KINDS.forEach(k=>S[k].forEach(x=>dbWrite(k,x))); closeModal(); toast('Respaldo importado'); render(); }catch(e){ $('#ierr').textContent='El texto no es un respaldo válido.'; } }; }
function setTema(v){ try{ localStorage.setItem('despacho_tema',v); }catch(e){} document.documentElement.setAttribute('data-theme', v); if(!v) document.documentElement.removeAttribute('data-theme'); }
function initTema(){ let v=''; try{ v=localStorage.getItem('despacho_tema')||''; }catch(e){} if(v) document.documentElement.setAttribute('data-theme',v); const s=$('#temaSel'); if(s) s.value=v; }

/* ---------- inicio ---------- */
(function init(){
  const had = lsLoad();
  initTema();
  render();
  const obs=new MutationObserver(()=>{ const s=$('#temaSel'); if(s){ let v=''; try{ v=localStorage.getItem('despacho_tema')||''; }catch(e){} s.value=v; } }); obs.observe($('#main'),{childList:true});
  connectDb().then(()=>{
    // sin base compartida y sin datos locales: cargar ejemplo para que el prototipo se pueda recorrer
    setTimeout(()=>{ if(!db && !had && !S.expedientes.length && !S.usuarios.length){ const d=seed(); KINDS.forEach(k=>S[k]=d[k]); lsSave(); render(); } }, 50);
  });
})();
</script>
</body>
