# Desarrollo local: docker compose up  →  http://localhost:8000
services:
  db:
    image: postgres:16
    environment: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: despacho}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_DEBUG: "1"
      DATABASE_URL: postgres://postgres:postgres@db:5432/despacho
    ports: ["8000:8000"]
    volumes: [".:/app"]
    depends_on: [db]
volumes:
  pgdata:
