# Especificación para DigitalOcean App Platform. Se pega en: App → Settings → App Spec → Edit.
# Antes de guardar, reemplaza cada CAMBIAR por su valor (las de tipo SECRET quedan cifradas).
#
# Publicación inicial: app + base + PDF. Se agregan después (Settings → Environment Variables):
#   correo  → EMAIL_HOST_PASSWORD (API key de Resend), DEFAULT_FROM_EMAIL
#   respaldos → RESPALDO_BUCKET, RESPALDO_ENDPOINT_URL, RESPALDO_ACCESS_KEY, RESPALDO_SECRET_KEY
#               y el worker `programador` (bloque comentado al final)
#   dominio propio → cambiar ${APP_DOMAIN} por sistema.tudespacho.mx en las 3 variables de dirección
name: despacho
region: sfo
alerts:
  - rule: DEPLOYMENT_FAILED
envs:
  - {key: DATABASE_URL, scope: RUN_AND_BUILD_TIME, value: "${db.DATABASE_URL}"}
  - {key: DJANGO_SECRET_KEY, scope: RUN_AND_BUILD_TIME, type: SECRET, value: CAMBIAR}
  - {key: DJANGO_ALLOWED_HOSTS, scope: RUN_TIME, value: "${APP_DOMAIN}"}
  - {key: DJANGO_CSRF_TRUSTED_ORIGINS, scope: RUN_TIME, value: "https://${APP_DOMAIN}"}
  - {key: SITIO_URL, scope: RUN_TIME, value: "https://${APP_DOMAIN}"}
  - {key: S3_BUCKET, scope: RUN_TIME, value: despacho-pdf}
  - {key: S3_ENDPOINT_URL, scope: RUN_TIME, value: "https://sfo3.digitaloceanspaces.com"}
  - {key: S3_REGION, scope: RUN_TIME, value: sfo3}
  - {key: S3_ACCESS_KEY, scope: RUN_TIME, type: SECRET, value: CAMBIAR}
  - {key: S3_SECRET_KEY, scope: RUN_TIME, type: SECRET, value: CAMBIAR}
databases:
  - name: db
    engine: PG
    version: "16"
    production: true
    cluster_name: despacho-db
jobs:
  - name: migrar
    kind: PRE_DEPLOY
    dockerfile_path: Dockerfile
    github: {repo: zdp78drbrh-ops/Despacho, branch: claude/despacho-juridico-arquitectura-ofa17c, deploy_on_push: true}
    run_command: python manage.py migrate --noinput
    instance_size_slug: apps-s-1vcpu-0.5gb
services:
  - name: web
    dockerfile_path: Dockerfile
    github: {repo: zdp78drbrh-ops/Despacho, branch: claude/despacho-juridico-arquitectura-ofa17c, deploy_on_push: true}
    http_port: 8000
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1
    health_check: {http_path: /salud/}
